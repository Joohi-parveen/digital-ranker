<!--====== Lead Form Submission UX Handler ======-->
<script>
document.addEventListener('DOMContentLoaded', function() {
    var leadForms = document.querySelectorAll('.lead-submission-form');
    leadForms.forEach(function(form) {
        form.addEventListener('submit', function(e) {
            if (!this.checkValidity()) {
                return;
            }
            var btn = this.querySelector('button[type="submit"], .submit-btn');
            if (btn) {
                // Prevent duplicate clicks
                if (btn.classList.contains('is-submitting')) {
                    e.preventDefault();
                    return false;
                }
                btn.classList.add('is-submitting');
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.75';
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Sending...';
            }
        });
    });
});
</script>
